spring:
  application:
    name: landscaping-api
  profiles:
    default: local
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/ells-landscaping}
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:smtp.fastmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:druid@celtechsolutions.tech}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    notify-to: ${MAIL_NOTIFY_TO:josh@ells4u.com}
    notify-from: ${MAIL_NOTIFY_FROM:mailer@celtechsolutions.tech}
  storage:
    local:
      root: ${LOCAL_IMAGE_ROOT:../local-images}
      public-prefix: ${LOCAL_IMAGE_PREFIX:/images}
    spaces:
      endpoint: ${SPACES_ENDPOINT:https://nyc3.digitaloceanspaces.com}
      region: ${SPACES_REGION:nyc3}
      bucket: ${SPACES_BUCKET:}
      access-key: ${SPACES_KEY:}
      secret-key: ${SPACES_SECRET:}
      cdn-base: ${SPACES_CDN_BASE:}

# Actuator: expose health only. Liveness/readiness are separated so App
# Platform can restart a wedged container without pulling a merely-warming
# one out of rotation permanently.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.studio.api: DEBUG
